[package]
name = "orinoco"
version = "0.1.0"
edition = "2024"


[dependencies]
orinoco_proc_macro = { path = "orinoco_proc_macro" }
anyhow = "*"
rkyv = "0.8.16"
serde_bare = "0.5.0"
serde_json = "1.0.150"


[dependencies.uuid]
version = "1.23.2"
features = ["v4"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.postcard]
version = "1.1.3"
features = ["alloc"]
